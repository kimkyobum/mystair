<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D South Korea Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
        <!-- 1. Pretendard 폰트 추가 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        @font-face {
            font-family: 'GmarketSans';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
        }
        @font-face {
            font-family: 'GmarketSansLight';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');
            font-weight: 300;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000; /* Deep space */
            background-image: 
                radial-gradient(ellipse at 50% 50%, rgba(15, 23, 42, 1), transparent 80%), 
                radial-gradient(circle at 20% 80%, rgba(30, 58, 138, 0.4), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(76, 29, 149, 0.3), transparent 50%),
                linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.9));
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        .logo-link:hover .logo-icon {
            transform: rotate(180deg) scale(1.1);
        }
        #canvas-container {
            position: absolute;
            left: 320px;
            width: calc(100vw - 320px);
            height: 100vh;
            display: block;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: calc(320px + (100vw - 320px) / 2);
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            font-weight: 500;
            color: #ffffff;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: opacity 0.5s ease;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            padding: 32px 48px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 50;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #2dd4bf;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #sidebar {
            position: absolute;
            left: 0;
            top: 0;
            width: 320px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 4px 0 24px rgba(0,0,0,0.5);
            z-index: 20;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        .sidebar-header {
            padding: 32px 28px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
                .sidebar-header h2 {
            margin: 0 0 12px 0;
            font-family: 'GmarketSans', sans-serif;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .search-container {
            margin-top: 20px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Pretendard', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            width: 16px;
            height: 16px;
        }
        .sidebar-header .count {

            display: inline-block;
            background: rgba(45, 212, 191, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: #2dd4bf;
            font-weight: 600;
        }
        #school-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #school-list::-webkit-scrollbar { width: 6px; }
        #school-list::-webkit-scrollbar-track { background: transparent; }
        #school-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        
        .school-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .school-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 32px rgba(45, 212, 191, 0.15);
            border-color: rgba(45, 212, 191, 0.4);
        }
        .school-card.active-card {
            border-color: #2dd4bf;
            background: rgba(45, 212, 191, 0.1);
            box-shadow: 0 4px 12px rgba(45, 212, 191, 0.2);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-field { font-size: 12px; color: #94a3b8; font-weight: 500; }
        .card-name { font-size: 15px; font-weight: 600; color: #ffffff; letter-spacing: -0.3px; }

        #title-overlay {
            position: absolute;
            top: 24px;
            left: 320px;
            width: calc(100% - 320px);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
                #title-overlay h1 {
            margin: 0;
            font-family: 'GmarketSans', sans-serif;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 30px rgba(255, 255, 255, 0.2);
        }
        
        .region-group { margin-bottom: 24px; }
        .region-header {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 0 0 12px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .region-header::before {
            content: '';
            display: block;
            width: 4px;
            height: 14px;
            background: #2dd4bf;
            border-radius: 2px;
        }
        .region-header .count {
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .school-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            cursor: pointer;
            pointer-events: auto;
        }
        .marker-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .marker-label {
            position: absolute;
            top: 100%;
            left: 50%;
            margin-top: 6px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) scale(0.9) translateY(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        
        .school-marker:hover .marker-label {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1) translateY(0);
            z-index: 100;
        }
        .school-marker:hover .marker-dot { 
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .school-marker.active .marker-dot {
            transform: scale(1.5);
            border-color: #2dd4bf;
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.8), 0 0 40px rgba(45, 212, 191, 0.4);
        }
        .school-marker.active .marker-label {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1) translateY(0);
            z-index: 100;
            border-color: #2dd4bf;
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.2);
        }

        .label-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .region-badge {
            color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
            letter-spacing: -0.2px;
        }
        .field-text { color: #94a3b8; font-size: 11px; font-weight: 500;}
        .school-name { font-weight: 600; color: #ffffff; font-size: 13px;}

        /* 메인 사이트에 어울리는 고급스러운 다크 테마 포인트 컬러들 (Teal, Purple, Indigo, Rose, Blue) */
        .bg-서울 { background-color: #6366f1; } .bg-인천 { background-color: #8b5cf6; }
        .bg-경기 { background-color: #a855f7; } .bg-강원 { background-color: #d946ef; }
        .bg-충남 { background-color: #ec4899; } .bg-충북 { background-color: #f43f5e; }
        .bg-대전 { background-color: #f43f5e; } .bg-전북 { background-color: #f97316; }
        .bg-광주 { background-color: #eab308; } .bg-전남 { background-color: #84cc16; }
        .bg-경북 { background-color: #10b981; } .bg-대구 { background-color: #14b8a6; }
        .bg-울산 { background-color: #06b6d4; } .bg-부산 { background-color: #0ea5e9; }
        .bg-경남 { background-color: #3b82f6; }
        
        /* 마커 닷 색상을 부드럽고 빛나는 다크 테마 컬러로 통일감 있게 수정 */
        .round-1, .round-6, .round-11, .round-16 { background-color: #2dd4bf; } /* Teal */
        .round-2, .round-7, .round-12, .round-17 { background-color: #a855f7; } /* Purple */
        .round-3, .round-8, .round-13, .round-18 { background-color: #6366f1; } /* Indigo */
        .round-4, .round-9, .round-14, .round-19 { background-color: #ec4899; } /* Pink */
        .round-5, .round-10, .round-15 { background-color: #3b82f6; } /* Blue */
        .round-others { background-color: #2dd4bf; }
        
        #info {
            position: absolute;
            bottom: 24px;
            left: 320px;
            width: calc(100% - 320px);
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <!-- 좌측 목록창 추가 -->
    <div id="sidebar">
        <div class="sidebar-header">
            <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 8px; cursor: pointer; color: white; width: fit-content;" class="logo-link">
                <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #2dd4bf; transition: transform 0.5s ease-out;" class="logo-icon">
                    <rect x="14" y="32" width="72" height="36" rx="18" stroke="currentColor" stroke-width="8" stroke-linejoin="round" transform="rotate(45 50 50)" />
                    <rect x="14" y="32" width="72" height="36" rx="18" stroke="currentColor" stroke-width="8" stroke-linejoin="round" transform="rotate(-45 50 50)" />
                </svg>
                <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.05em; background: linear-gradient(to right, #fff, rgba(255,255,255,0.5)); -webkit-background-clip: text; color: transparent;">Mystair</span>
            </a>
                        <div>
                <h2>전국 마이스터고</h2>
                <div class="count" id="school-count">총 58개교 목록</div>
                
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="school-search" class="search-input" placeholder="학교명, 지역, 분야 검색...">
                </div>
            </div>
        </div>
        <div id="school-list"></div>
    </div>

    <div id="title-overlay" style="display: flex; align-items: center; justify-content: center; position: absolute; top: 24px; left: 320px; width: calc(100% - 320px); z-index: 10;">
        <h1 style="margin: 0;">전국 마이스터고 지도</h1>
        <div style="position: absolute; right: 32px; pointer-events: auto; display: flex; align-items: center; gap: 12px;">
            <!-- Language Selector -->
            <div style="display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 9999px; padding: 2px; font-size: 11px; backdrop-filter: blur(8px);">
                <button 
                  id="lang-ko-btn"
                  style="padding: 4px 10px; border-radius: 9999px; font-weight: 700; transition: all 0.2s; cursor: pointer; border: 1px solid transparent; background: transparent; color: #94a3b8; outline: none; font-family: inherit;"
                  onclick="setLanguage('ko')"
                >
                  한국어
                </button>
                <button 
                  id="lang-en-btn"
                  style="padding: 4px 10px; border-radius: 9999px; font-weight: 700; transition: all 0.2s; cursor: pointer; border: 1px solid transparent; background: transparent; color: #94a3b8; outline: none; font-family: inherit;"
                  onclick="setLanguage('en')"
                >
                  English
                </button>
            </div>
            <a href="/creators.html" style="color: #e2e8f0; text-decoration: none; font-size: 14px; font-weight: 600; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); transition: all 0.2s ease;" onmouseover="this.style.color='#fff'; this.style.background='rgba(45, 212, 191, 0.2)'; this.style.borderColor='rgba(45, 212, 191, 0.4)';" onmouseout="this.style.color='#e2e8f0'; this.style.background='rgba(255, 255, 255, 0.1)'; this.style.borderColor='rgba(255, 255, 255, 0.15)';">만든 사람들</a>
        </div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <div>전국 마이스터고 3D 지도를 렌더링하고 있습니다...</div>
    </div>
    <div id="info">마우스를 드래그하여 지도를 회전하거나 스크롤하여 확대/축소할 수 있습니다.</div>
    <div id="canvas-container"></div>

    <!-- Language Support -->
    <script>

            const lang = getCurrentLanguage();

            stars = new THREE.Group();
            
            // 둥근 별 텍스처(Soft Circle) 생성
            const starCanvas = document.createElement('canvas');
            starCanvas.width = 32;
            starCanvas.height = 32;
            const starCtx = starCanvas.getContext('2d');
            
            // 부드러운 빛 효과를 위한 방사형 그라데이션
            const gradient = starCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');

            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            starCtx.fillStyle = gradient;
            starCtx.fillRect(0, 0, 32, 32);
            
            const starTexture = new THREE.CanvasTexture(starCanvas);
            
            // 일반 별 (배경)
            const starGeo1 = new THREE.BufferGeometry();
            const starMat1 = new THREE.PointsMaterial({ 
                color: 0xffffff, 
                size: 0.2, // 텍스처가 흐릿해지므로 크기 증가
                transparent: true, 
                opacity: 0.9,
                map: starTexture,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true 
            });
            const starVerts1 = [];
            
            // 은하수 별 (조밀한 띠)
            const starGeo2 = new THREE.BufferGeometry();
            const starMat2 = new THREE.PointsMaterial({ 
                color: 0x60a5fa, // 밝은 파랑
                size: 0.3, 
                transparent: true, 
                opacity: 0.8,
                map: starTexture,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });
            const starVerts2 = [];

            // 은하수 중심부 (밝고 큰 별들)
            const starGeo3 = new THREE.BufferGeometry();
            const starMat3 = new THREE.PointsMaterial({ 
                color: 0xd8b4fe, // 밝은 보라
                size: 0.4, 
                transparent: true, 
                opacity: 0.9,
                map: starTexture,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });
            const starVerts3 = [];

            // 은하수 먼지 (거대한 희미한 입자들로 은하수 텍스처 느낌 부여)
            const dustGeo = new THREE.BufferGeometry();
            const dustMat = new THREE.PointsMaterial({ 
                color: 0x312e81, // 딥 인디고
                size: 4.0, 
                transparent: true, 
                opacity: 0.15,
                map: starTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const dustVerts = [];


            // 배경 일반 별
            for(let i = 0; i < 5000; i++) {
                starVerts1.push(
                    (Math.random() - 0.5) * 200, 
                    (Math.random() - 0.5) * 200, 
                    (Math.random() - 0.5) * 200
                );
            }

            // 은하수 띠 생성 (나선팔 또는 띠 형태)
            for(let i = 0; i < 8000; i++) {
                // 원기둥 좌표계 기반의 띠 모양 (화면 대각선을 가로지르도록)
                let r = 30 + Math.random() * 50; // 거리
                let theta = Math.random() * Math.PI * 2; // 원통 각도
                
                // 중심에서 멀어질수록 퍼지게 (가우시안 분포 흉내)
                let spread = (Math.random() + Math.random() + Math.random() - 1.5);
                let height = spread * 15; // 띠의 두께
                
                // 원통 좌표계를 3D로
                let x = r * Math.cos(theta);
                let y = height;
                let z = r * Math.sin(theta);

                // 은하수를 45도 기울임
                let tilt = Math.PI / 4;
                let finalX = x * Math.cos(tilt) - y * Math.sin(tilt);
                let finalY = x * Math.sin(tilt) + y * Math.cos(tilt);
                let finalZ = z;

                if (i < 5000) {
                    starVerts2.push(finalX, finalY, finalZ); // 일반 은하수 별
                } else if (i < 7000) {
                    starVerts3.push(finalX, finalY, finalZ); // 밝은 중심부
                } else {
                    dustVerts.push(finalX, finalY, finalZ); // 은하수 성간 먼지
                }
            }

            starGeo1.setAttribute('position', new THREE.Float32BufferAttribute(starVerts1, 3));
            starGeo2.setAttribute('position', new THREE.Float32BufferAttribute(starVerts2, 3));
            starGeo3.setAttribute('position', new THREE.Float32BufferAttribute(starVerts3, 3));
            dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustVerts, 3));

            stars.add(new THREE.Points(starGeo1, starMat1));
            stars.add(new THREE.Points(starGeo2, starMat2));
            stars.add(new THREE.Points(starGeo3, starMat3));
            stars.add(new THREE.Points(dustGeo, dustMat));

            // 지도가 화면 중앙에 있으므로, 은하수가 배경에서 웅장하게 보이도록 살짝 뒤로 밀어줍니다.

        async function loadMapData() {
            try {
                const response = await fetch(GEOJSON_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const geoJson = await response.json();
                
                // 로딩 UI 숨기기
                document.getElementById('loading').style.opacity = '0';
                
                generate3DMap(geoJson);
            } catch (error) {
                console.error("지도 데이터를 불러오는 중 오류 발생:", error);
                document.getElementById('loading').innerHTML = "지도 데이터를 불러오는 데 실패했습니다.<br>새로고침을 시도해주세요.";
            }
        }

        function generate3DMap(geoJson) {
            // D3 메르카토르 투영법을 사용하여 위도/경도를 2D X/Y 평면으로 변환
            const projection = d3.geoMercator()
                .center([127.5, 36.0]) // 대한민국 중심 좌표
                .scale(35)             // 전국 마이스터고 지도 제목이 가려지지 않도록 스케일을 살짝 작게 조절
                .translate([0, 0]);

            
            
            
            
            
            // 깔끔한 기본 회색 톤
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x9ca3af,       // 중간 회색
                emissive: 0x374151,    // 살짝 밝은 회색 발광으로 뚜렷하게
                roughness: 0.6,        // 매트한 느낌
                metalness: 0.1,        // 메탈릭 감소 (자연스러운 회색)
                clearcoat: 0.0,        // 반사 제거
                transparent: true,
                opacity: 0.95,
                side: THREE.DoubleSide
            });

            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0xd1d5db,       // 밝은 회색 테두리
                linewidth: 1,
                transparent: true,
                opacity: 0.6
            });




            // Three.js 3D 압출(Extrude) 옵션 (세련되고 얇은 두께)
            const extrudeSettings = {
                depth: 0.15,         // 적당히 얇고 고급스러운 두께
                bevelEnabled: true,  
                bevelSegments: 4,    // 더 부드러운 모서리
                steps: 1,
                bevelSize: 0.02,     // 엣지 하이라이트를 위한 약간의 베벨
                bevelThickness: 0.02
            };

            // GeoJSON의 각 Feature(지역) 순회
            geoJson.features.forEach(feature => {
                const geometry = feature.geometry;
                
                // Polygon인지 MultiPolygon인지 구별하여 처리
                if (geometry.type === 'Polygon') {
                    createPolygonShape(geometry.coordinates, projection, extrudeSettings, material, lineMaterial);
                } else if (geometry.type === 'MultiPolygon') {
                    geometry.coordinates.forEach(coords => {
                        createPolygonShape(coords, projection, extrudeSettings, material, lineMaterial);
                    });
                }
            });

            addSchoolMarkers(projection);

            // 지도 전체를 화면 중앙에 정렬하기 위해 BoundingBox 계산
            const box = new THREE.Box3().setFromObject(mapGroup);
            const center = box.getCenter(new THREE.Vector3());
            
            // 중심으로 이동 (사이드바를 제외한 실제 화면의 중앙)
            mapGroup.position.x = -center.x;
            mapGroup.position.y = -center.y;
            // z축은 바닥 평면에 맞춤
            mapGroup.position.z = 0; 
        }

        function addSchoolMarkers(projection) {
            meisterSchools.forEach(school => {
                const [x, y] = projection([school.lng, school.lat]);
                
                // 마커 컨테이너
                const markerDiv = document.createElement('div');
                markerDiv.className = 'school-marker';
                
                // 마커 점 (차수별 색상 클래스 적용 - 1차~19차 동적 처리)
                const dotClass = (school.round >= 1 && school.round <= 19) ? `round-${school.round}` : 'round-others';
                const dotDiv = document.createElement('div');
                dotDiv.className = `marker-dot ${dotClass}`;
                
                // 라벨 팝업
                const labelDiv = document.createElement('div');
                labelDiv.className = 'marker-label';
                
                const currentLang = getCurrentLanguage();
                const regionText = currentLang === 'en' ? (regionMap[school.region] || school.region) : school.region;
                const fieldText = currentLang === 'en' && window.enFields ? window.enFields[school.field] || school.field : school.field;
                const nameText = currentLang === 'en' && window.enNames ? window.enNames[school.name] || school.name : school.name;

                labelDiv.innerHTML = `
                    <div class="label-top">
                        <span class="region-badge bg-${school.region}" data-original-region="${school.region}">${regionText}</span>
                        <span class="field-text" data-original-field="${school.field}">${fieldText}</span>
                    </div>
                    <span class="school-name" data-original-name="${school.name}">${nameText}</span>
                `;

                
                markerDiv.appendChild(dotDiv);
                markerDiv.appendChild(labelDiv);
                
                // 지도 마커 클릭 시 해당 학교 포커스 및 사이드바 스크롤 이벤트 추가
                markerDiv.onclick = () => focusOnSchool(school);
                
                // CSS2DObject 생성 및 3D 공간 배치
                const cssObject = new THREE.CSS2DObject(markerDiv);
                
                // Three.js 좌표계에 맞게 Y값 반전 및 Z값(지도 위로 띄움, 핀이 정확하게 지도 표면에 붙도록 Z 조정)
                cssObject.position.set(x, -y, 0.18); 
                
                // mapGroup에 추가하여 지도가 이동/회전할 때 함께 움직이게 함
                mapGroup.add(cssObject); 
                
                // 클릭 연동을 위해 학교 객체에 cssObject 저장
                school.cssObject = cssObject;
            });
            
            // 사이드바 목록 렌더링 호출
            populateSidebar();
        }

        // 사이드바에 데이터 동적 생성 함수 (지역별 분류 적용)
        
        function populateSidebar() {
            const listContainer = document.getElementById('school-list');
            listContainer.innerHTML = '';
            
            const lang = getCurrentLanguage();
            const t = mapTranslations[lang];
            
            // 제목 갯수 동적 업데이트
            document.getElementById('school-count').innerText = t.count_format(meisterSchools.length);

            // 1. 지역별로 데이터 그룹화
            const groupedSchools = {};
            meisterSchools.forEach(school => {
                if (!groupedSchools[school.region]) {
                    groupedSchools[school.region] = [];
                }
                groupedSchools[school.region].push(school);
            });

            // 2. 지역별 노출 순서 지정
            const regionOrder = ['서울', '인천', '경기', '강원', '충북', '충남', '대전', '전북', '전남', '광주', '경북', '대구', '울산', '부산', '경남', '세종', '제주'];
            
            const regions = Object.keys(groupedSchools).sort((a, b) => {
                let indexA = regionOrder.indexOf(a);
                let indexB = regionOrder.indexOf(b);
                if (indexA === -1) indexA = 999;
                if (indexB === -1) indexB = 999;
                return indexA - indexB;
            });

            // 3. 그룹화된 데이터 순회하며 렌더링
            regions.forEach(region => {
                const schoolsInRegion = groupedSchools[region];
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'region-group';
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'region-header';
                
                const regionText = lang === 'en' ? (regionMap[region] || region) : region;
                
                headerDiv.innerHTML = `<span class="region-badge bg-${region}">${regionText}</span> <span style="font-size:12px; color:#94a3b8; font-weight:400; margin-left:6px;">${schoolsInRegion.length}${lang === 'en' ? '' : '개'}</span>`;
                groupDiv.appendChild(headerDiv);

                // 해당 지역의 학교 카드들
                schoolsInRegion.forEach(school => {
                    const card = document.createElement('div');
                    card.className = 'school-card';
                    card.id = `card-${school.name}`;
                    card.style.marginBottom = '10px';
                    
                    const fieldText = lang === 'en' && window.enFields ? window.enFields[school.field] || school.field : school.field;
                    const schoolNameText = lang === 'en' && window.enNames ? window.enNames[school.name] || school.name : school.name;
                    // You could add a field dictionary for full English translations, but let's leave it as is or handle common ones if needed
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="region-badge bg-${school.region}">${regionText}</span>
                            <span class="card-field">${fieldText}</span>
                        </div>
                        <div class="card-name">${schoolNameText}</div>
                    `;

                    // 리스트 클릭 시 지도 카메라 이동
                    card.onclick = () => focusOnSchool(school);
                    
                    groupDiv.appendChild(card);
                });
                
                listContainer.appendChild(groupDiv);
            });
        }


        // 특정 학교 클릭 시 포커스 및 하이라이트 효과
        function focusOnSchool(school) {
            // 1. 기존 활성화 요소 초기화
            document.querySelectorAll('.school-card').forEach(el => el.classList.remove('active-card'));
            document.querySelectorAll('.school-marker').forEach(el => el.classList.remove('active'));

            // 2. 선택된 요소 하이라이트
            const card = document.getElementById(`card-${school.name}`);
            if (card) {
                card.classList.add('active-card');
                // 사이드바에서 해당 학교 카드가 보이도록 부드럽게 스크롤 이동
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            if (school.cssObject && school.cssObject.element) {
                school.cssObject.element.classList.add('active');
                
                // 3. 카메라 및 타겟 위치를 학교 위젯으로 이동
                const targetPos = new THREE.Vector3();
                school.cssObject.getWorldPosition(targetPos);

                const offset = targetPos.clone().sub(controls.target);
                camera.position.add(offset);
                controls.target.copy(targetPos);
                controls.update();
            }
        }

        function createPolygonShape(coordinates, projection, extrudeSettings, material, lineMaterial) {
            const shape = new THREE.Shape();
            
            // coordinates[0]는 외곽선, 그 이상은 구멍(Holes)
            const outerBounds = coordinates[0];
            outerBounds.forEach((coord, i) => {
                const [x, y] = projection(coord);
                // Three.js는 Y축이 위로 증가하지만, D3 투영은 반대이므로 Y를 반전
                if (i === 0) {
                    shape.moveTo(x, -y);
                } else {
                    shape.lineTo(x, -y);
                }
            });

            // 구멍(Holes)이 있는 지역 처리 (예: 호수 등)
            for (let i = 1; i < coordinates.length; i++) {
                const hole = new THREE.Path();
                coordinates[i].forEach((coord, j) => {
                    const [x, y] = projection(coord);
                    if (j === 0) {
                        hole.moveTo(x, -y);
                    } else {
                        hole.lineTo(x, -y);
                    }
                });
                shape.holes.push(hole);
            }

            // 1. 3D 메쉬 생성
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // 2. 경계선(테두리) 생성 - EdgesGeometry 사용
            const edgesGeo = new THREE.EdgesGeometry(geometry, 20); // 20도 이상 꺾인 부분만 선으로 표시
            const line = new THREE.LineSegments(edgesGeo, lineMaterial);
            
            mesh.add(line);
            mapGroup.add(mesh);
        }

        function onWindowResize() {
            const width = window.innerWidth - 320;
            const height = window.innerHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (stars) {
                stars.rotation.y += 0.0005;
                stars.rotation.x += 0.0002;
            }
            // OrbitControls 업데이트 (관성 효과)
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // 페이지 로드 완료 시 초기화 및 애니메이션 시작
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
